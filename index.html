<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sanu Thompson — Photographer &amp; Filmmaker</title>
<meta name="description" content="Sanu Thompson is a photographer and filmmaker based in Chennai, India, documenting weddings, portraits, families, brands and everyday life." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --ink:#171717;
    --ink-soft:#666666;
    --line:#E5E5E5;
    --line-soft:#F0F0F0;
    --accent:#A9906F;
    --nav-h:72px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-weight:400;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  img{max-width:100%;display:block;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}

  .label{
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    font-weight:500;
  }
  .label.dark{color:var(--ink);}

  /* ---------- NAV ---------- */
  header.site-nav{
    position:fixed;top:0;left:0;right:0;z-index:1000;
    height:var(--nav-h);
    display:flex;align-items:center;justify-content:space-between;
    padding:0 40px;
    background:rgba(255,255,255,.88);
    backdrop-filter:blur(10px);
    border-bottom:1px solid transparent;
    transition:border-color .3s ease;
  }
  header.site-nav.scrolled{border-bottom-color:var(--line);}
  .wordmark{
    font-size:14px;
    letter-spacing:.12em;
    font-weight:600;
    text-transform:uppercase;
  }
  nav.primary-nav{display:flex;align-items:center;gap:36px;}
  nav.primary-nav a{
    font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-soft);position:relative;padding:4px 0;
    transition:color .2s ease;
  }
  nav.primary-nav a:hover,nav.primary-nav a.active{color:var(--ink);}
  nav.primary-nav a::after{
    content:'';position:absolute;left:0;bottom:-2px;height:1px;width:0;
    background:var(--ink);transition:width .25s ease;
  }
  nav.primary-nav a:hover::after,nav.primary-nav a.active::after{width:100%;}
  .nav-ig{display:flex;align-items:center;margin-left:4px;color:var(--ink-soft);transition:color .2s ease;}
  .nav-ig:hover{color:var(--ink);}
  .nav-divider{width:1px;height:16px;background:var(--line);margin:0 2px;}
  .mobile-nav-toggle{display:none;}

  @media (max-width:860px){
    header.site-nav{padding:0 20px;}
    nav.primary-nav{
      position:fixed;top:var(--nav-h);left:0;right:0;bottom:0;
      background:#fff;flex-direction:column;justify-content:flex-start;
      align-items:flex-start;padding:40px 28px;gap:26px;
      transform:translateX(100%);transition:transform .35s ease;
    }
    nav.primary-nav.open{transform:translateX(0);}
    nav.primary-nav a{font-size:13px;}
    .mobile-nav-toggle{
      display:flex;flex-direction:column;gap:5px;background:none;border:none;
      padding:8px;cursor:pointer;z-index:1001;
    }
    .mobile-nav-toggle span{width:20px;height:1px;background:var(--ink);display:block;transition:all .25s ease;}
    .mobile-nav-toggle.open span:nth-child(1){transform:translateY(6px) rotate(45deg);}
    .mobile-nav-toggle.open span:nth-child(2){opacity:0;}
    .mobile-nav-toggle.open span:nth-child(3){transform:translateY(-6px) rotate(-45deg);}
    .nav-ig{display:none;}
  }

  main{padding-top:var(--nav-h);}

  /* ---------- HERO SLIDER ---------- */
  .hero{
    position:relative;width:100%;
    height:78vh;min-height:460px;
    overflow:hidden;background:#f3f3f3;
  }
  .hero-slide{
    position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease;
  }
  .hero-slide.active{opacity:1;}
  .hero-slide img{width:100%;height:100%;object-fit:cover;}
  .hero-meta{
    position:absolute;left:28px;right:28px;bottom:22px;
    display:flex;justify-content:space-between;align-items:flex-end;
    pointer-events:none;
  }
  .hero-meta .label{color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.35);}
  .hero-arrows{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;
    padding:0 18px;pointer-events:none;
  }
  .hero-arrow{
    pointer-events:auto;width:40px;height:40px;border-radius:50%;
    border:none;background:rgba(255,255,255,.18);backdrop-filter:blur(4px);
    color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:background .2s ease;
  }
  .hero-arrow:hover{background:rgba(255,255,255,.32);}
  .hero-progress{
    position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.25);
  }
  .hero-progress-bar{height:100%;background:#fff;width:0%;}

  /* ---------- INTRO ---------- */
  .intro{
    max-width:720px;margin:0 auto;padding:88px 28px 72px;text-align:center;
  }
  .intro h1{
    font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;margin:0 0 10px;
  }
  .intro .role{
    font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 26px;
  }
  .intro p.tagline{
    font-size:19px;line-height:1.55;font-weight:300;color:#2b2b2b;margin:0;
  }

  /* ---------- SELECTED WORK ---------- */
  section.selected{padding:20px 40px 110px;}
  .selected-head{
    display:flex;justify-content:space-between;align-items:flex-end;
    border-top:1px solid var(--line);padding-top:26px;margin-bottom:40px;flex-wrap:wrap;gap:16px;
  }
  .selected-head h2.big{
    font-size:clamp(28px,4vw,42px);font-weight:300;margin:10px 0 0;letter-spacing:-.01em;
  }
  .view-all{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);white-space:nowrap;}
  .view-all:hover{color:var(--ink);}

  .selected-grid{
    display:grid;grid-template-columns:repeat(12,1fr);gap:14px;
  }
  .sg-item{position:relative;overflow:hidden;cursor:pointer;background:#f0f0f0;}
  .sg-item img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s cubic-bezier(.2,.7,.2,1);}
  .sg-item:hover img{transform:scale(1.045);}
  .sg-overlay{
    position:absolute;inset:0;background:rgba(10,10,10,0);transition:background .35s ease;
    display:flex;flex-direction:column;justify-content:flex-end;padding:18px;
  }
  .sg-item:hover .sg-overlay{background:rgba(10,10,10,.28);}
  .sg-cat{color:#fff;font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:0;transform:translateY(6px);transition:all .35s ease;}
  .sg-title{color:#fff;font-size:17px;font-weight:400;opacity:0;transform:translateY(6px);transition:all .4s ease .03s;margin:2px 0 6px;}
  .sg-link{color:#fff;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:0;transform:translateY(6px);transition:all .4s ease .06s;}
  .sg-item:hover .sg-cat,.sg-item:hover .sg-title,.sg-item:hover .sg-link{opacity:1;transform:translateY(0);}

  .sg-1{grid-column:span 5;aspect-ratio:3/4;}
  .sg-2{grid-column:span 7;aspect-ratio:16/10.5;}
  .sg-3{grid-column:span 4;aspect-ratio:1/1;}
  .sg-4{grid-column:span 4;aspect-ratio:1/1;}
  .sg-5{grid-column:span 4;aspect-ratio:1/1;}
  .sg-6{grid-column:span 6;aspect-ratio:4/3;}
  .sg-7{grid-column:span 6;aspect-ratio:4/3;}

  @media (max-width:860px){
    section.selected{padding:12px 20px 70px;}
    .selected-grid{grid-template-columns:repeat(2,1fr);}
    .sg-1,.sg-2,.sg-3,.sg-4,.sg-5,.sg-6,.sg-7{grid-column:span 2;aspect-ratio:4/5;}
  }

  /* ---------- ABOUT ---------- */
  section.about{padding:30px 40px 120px;border-top:1px solid var(--line);}
  .about-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center;max-width:1280px;margin:0 auto;
  }
  .about-grid img{width:100%;aspect-ratio:4/5;object-fit:cover;}
  .about-copy h2.heading{
    font-size:clamp(26px,3.2vw,38px);font-weight:300;line-height:1.25;margin:14px 0 20px;letter-spacing:-.01em;
  }
  .about-copy p{font-size:15px;line-height:1.75;color:#333;font-weight:300;margin:0 0 16px;max-width:460px;}
  .about-more{
    display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    margin-top:8px;padding-bottom:2px;border-bottom:1px solid var(--ink);
  }
  .about-facts{display:flex;gap:46px;margin-top:46px;flex-wrap:wrap;}
  .about-facts div p{margin:6px 0 0;font-size:14px;font-weight:300;color:var(--ink);}

  @media (max-width:860px){
    section.about{padding:20px 20px 80px;}
    .about-grid{grid-template-columns:1fr;gap:32px;}
    .about-facts{gap:30px;}
  }

  /* ---------- WORK PAGE ---------- */
  .page-head{padding:56px 40px 36px;border-bottom:1px solid var(--line);}
  .page-head .label{margin-bottom:10px;}
  .page-head h1{font-size:clamp(30px,4.5vw,46px);font-weight:300;margin:0 0 10px;letter-spacing:-.01em;}
  .page-head p{font-size:15px;color:var(--ink-soft);font-weight:300;margin:0;max-width:520px;}

  .filters{
    display:flex;gap:28px;flex-wrap:wrap;padding:22px 40px;border-bottom:1px solid var(--line);
    position:sticky;top:var(--nav-h);background:rgba(255,255,255,.92);backdrop-filter:blur(8px);z-index:50;
  }
  .filter-btn{
    background:none;border:none;cursor:pointer;padding:4px 0;
    font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);
    border-bottom:1px solid transparent;transition:color .2s ease,border-color .2s ease;
  }
  .filter-btn:hover{color:var(--ink);}
  .filter-btn.active{color:var(--ink);border-bottom-color:var(--ink);}

  .masonry{
    column-count:3;column-gap:14px;padding:36px 40px 100px;
  }
  .masonry-item{
    break-inside:avoid;margin-bottom:14px;position:relative;cursor:pointer;overflow:hidden;background:#f0f0f0;
  }
  .masonry-item img{width:100%;display:block;transition:transform .6s ease;}
  .masonry-item:hover img{transform:scale(1.035);}
  .mi-overlay{
    position:absolute;inset:0;background:rgba(10,10,10,0);transition:background .3s ease;
    display:flex;align-items:flex-end;padding:14px;
  }
  .masonry-item:hover .mi-overlay{background:rgba(10,10,10,.22);}
  .mi-overlay span{
    color:#fff;font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:0;transition:opacity .3s ease;
  }
  .masonry-item:hover .mi-overlay span{opacity:1;}

  @media (max-width:860px){
    .masonry{column-count:1;padding:24px 20px 70px;}
    .filters{padding:16px 20px;gap:18px;overflow-x:auto;white-space:nowrap;}
    .page-head{padding:40px 20px 26px;}
  }
  @media (min-width:861px) and (max-width:1180px){
    .masonry{column-count:2;}
  }

  /* ---------- PROJECT / STORY PAGE ---------- */
  .project-head{padding:60px 40px 30px;max-width:720px;}
  .project-head h1{font-size:clamp(30px,5vw,52px);font-weight:300;margin:12px 0 16px;letter-spacing:-.01em;}
  .project-meta{font-size:13px;color:var(--ink-soft);font-weight:300;margin:0 0 22px;}
  .project-desc{font-size:16px;line-height:1.75;font-weight:300;color:#333;margin:0;}
  .project-hero{padding:10px 40px 0;}
  .project-hero img{width:100%;max-height:86vh;object-fit:cover;}
  .project-sequence{
    display:grid;grid-template-columns:repeat(2,1fr);gap:16px;
    padding:50px 40px 60px;max-width:1300px;margin:0 auto;
  }
  .project-sequence img{width:100%;object-fit:cover;cursor:pointer;}
  .project-sequence .wide{grid-column:1/-1;}
  .project-sequence .ps-item:nth-child(5n+3){aspect-ratio:3/4;height:100%;}
  .project-nav{
    display:flex;justify-content:space-between;align-items:center;
    padding:34px 40px 100px;border-top:1px solid var(--line);margin-top:10px;
  }
  .project-nav a{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);}
  .project-nav a:hover{color:var(--ink);}
  .project-nav a.next{text-align:right;}

  @media (max-width:860px){
    .project-head{padding:40px 20px 20px;}
    .project-hero{padding:6px 20px 0;}
    .project-sequence{grid-template-columns:1fr;padding:30px 20px 40px;}
    .project-nav{padding:24px 20px 70px;}
  }

  /* ---------- FILMS PAGE ---------- */
  .film-featured{padding:0 40px;margin-top:10px;}
  .film-card{
    position:relative;cursor:pointer;overflow:hidden;background:#111;margin-bottom:4px;
  }
  .film-card img{width:100%;aspect-ratio:16/9;object-fit:cover;opacity:.88;transition:transform .7s ease,opacity .4s ease;}
  .film-card:hover img{transform:scale(1.03);opacity:1;}
  .film-play{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:68px;height:68px;border-radius:50%;border:1px solid rgba(255,255,255,.6);
    display:flex;align-items:center;justify-content:center;transition:all .3s ease;
  }
  .film-card:hover .film-play{background:rgba(255,255,255,.95);}
  .film-card:hover .film-play svg path{fill:#111;}
  .film-info{position:absolute;left:28px;bottom:24px;}
  .film-info .label{color:#ddd;}
  .film-info h3{color:#fff;font-size:clamp(20px,2.6vw,30px);font-weight:300;margin:8px 0 0;}

  .film-list{
    display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px 40px 100px;
  }
  .film-list .film-card img{aspect-ratio:16/9;}
  .film-list .film-info h3{font-size:19px;}

  @media (max-width:860px){
    .film-featured{padding:0 20px;}
    .film-list{grid-template-columns:1fr;padding:12px 20px 70px;}
    .film-info{left:18px;bottom:16px;}
  }

  /* ---------- CONTACT PAGE ---------- */
  .contact-wrap{
    display:grid;grid-template-columns:1.2fr .8fr;gap:90px;
    padding:70px 40px 120px;max-width:1280px;margin:0 auto;
  }
  .contact-copy h1{font-size:clamp(30px,5vw,50px);font-weight:300;margin:14px 0 14px;letter-spacing:-.01em;}
  .contact-copy p.lead{font-size:16px;color:var(--ink-soft);font-weight:300;max-width:400px;margin:0;}
  form.contact-form{margin-top:48px;max-width:440px;}
  .f-row{margin-bottom:26px;}
  .f-row label{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px;}
  .f-row input,.f-row select,.f-row textarea{
    width:100%;border:none;border-bottom:1px solid var(--line);background:transparent;
    padding:8px 0;font-family:inherit;font-size:15px;font-weight:300;color:var(--ink);
    outline:none;transition:border-color .2s ease;
  }
  .f-row input:focus,.f-row select:focus,.f-row textarea:focus{border-color:var(--ink);}
  .f-row textarea{resize:vertical;min-height:70px;}
  .submit-btn{
    background:var(--ink);color:#fff;border:none;padding:13px 26px;
    font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
    transition:background .2s ease;margin-top:6px;
  }
  .submit-btn:hover{background:#000;}
  .form-confirm{display:none;font-size:14px;color:var(--ink);padding-top:10px;}
  .contact-side{border-left:1px solid var(--line);padding-left:50px;}
  .contact-side .block{margin-bottom:38px;}
  .contact-side .block p{font-size:15px;font-weight:300;margin:8px 0 0;line-height:1.6;}
  @media (max-width:860px){
    .contact-wrap{grid-template-columns:1fr;gap:50px;padding:40px 20px 80px;}
    .contact-side{border-left:none;padding-left:0;border-top:1px solid var(--line);padding-top:36px;}
  }

  /* ---------- FOOTER ---------- */
  footer{border-top:1px solid var(--line);padding:60px 40px 36px;}
  .footer-grid{
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:40px;max-width:1280px;margin:0 auto 40px;
  }
  .footer-col .wordmark{display:block;margin-bottom:16px;}
  .footer-col a,.footer-col span{display:block;font-size:12px;color:var(--ink-soft);line-height:2.1;}
  .footer-col a:hover{color:var(--ink);}
  .footer-col h4{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 10px;font-weight:500;}
  .footer-bottom{
    max-width:1280px;margin:0 auto;padding-top:24px;border-top:1px solid var(--line-soft);
    display:flex;justify-content:space-between;color:var(--ink-soft);font-size:11px;flex-wrap:wrap;gap:8px;
  }
  @media (max-width:860px){footer{padding:46px 20px 30px;}}

  /* ---------- LIGHTBOX ---------- */
  .lightbox{
    position:fixed;inset:0;background:rgba(10,10,10,.96);z-index:2000;
    display:none;align-items:center;justify-content:center;
  }
  .lightbox.open{display:flex;}
  .lightbox img{max-width:88vw;max-height:84vh;object-fit:contain;}
  .lb-close{position:absolute;top:24px;right:28px;color:#fff;background:none;border:none;cursor:pointer;opacity:.8;}
  .lb-close:hover{opacity:1;}
  .lb-arrow{
    position:absolute;top:50%;transform:translateY(-50%);background:none;border:none;color:#fff;
    cursor:pointer;opacity:.75;padding:14px;
  }
  .lb-arrow:hover{opacity:1;}
  .lb-prev{left:6px;}
  .lb-next{right:6px;}
  .lb-caption{position:absolute;bottom:26px;left:0;right:0;text-align:center;color:#ddd;font-size:11px;letter-spacing:.1em;text-transform:uppercase;}

  /* ---------- FADE-IN REVEAL ---------- */
  .reveal{opacity:0;transform:translateY(14px);transition:opacity .7s ease,transform .7s ease;}
  .reveal.in{opacity:1;transform:none;}

  ::selection{background:var(--ink);color:#fff;}
</style>
</head>
<body>

<header class="site-nav" id="siteNav">
  <a href="#/" class="wordmark">Sanu Thompson</a>
  <button class="mobile-nav-toggle" id="navToggle" aria-label="Menu"><span></span><span></span><span></span></button>
  <nav class="primary-nav" id="primaryNav">
    <a href="#about" data-route="about">About</a>
    <a href="#/work" data-route="work">Work</a>
    <a href="#/films" data-route="films">Films</a>
    <a href="#/contact" data-route="contact">Contact</a>
    <span class="nav-divider"></span>
    <a href="https://www.instagram.com/sanujoethompson/" target="_blank" rel="noopener" class="nav-ig" aria-label="Instagram">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r="1"/></svg>
    </a>
  </nav>
</header>

<main id="app"></main>

<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose" aria-label="Close">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="4" y1="4" x2="20" y2="20"/><line x1="20" y1="4" x2="4" y2="20"/></svg>
  </button>
  <button class="lb-arrow lb-prev" id="lbPrev" aria-label="Previous">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <img id="lbImg" src="" alt="" />
  <button class="lb-arrow lb-next" id="lbNext" aria-label="Next">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M9 5l7 7-7 7"/></svg>
  </button>
  <div class="lb-caption" id="lbCaption"></div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
